services:
  app:
    build: .
    container_name: pfehadjer-app
    ports:
      - "8000:8000"
    environment:
      MONGO_URI: mongodb://mongodb:27017
      SUPABASE_URL: https://jmxctdcosdckpbufocwc.supabase.co
      SUPABASE_KEY: sb_publishable_mqd59UHa-nfnHa6ZBs0dvQ_lL5vp2WK
      FRONTEND_ORIGINS: http://127.0.0.1:5501,http://localhost:5501,http://127.0.0.1:5500,http://localhost:5500
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped
  mongodb:
    image: mongo:7.0
    container_name: pfehadjer-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
volumes:
  mongodb_data:
