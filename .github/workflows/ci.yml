name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests (if any)
        run: |
          if [ -d "tests" ] || grep -q "pytest" requirements.txt 2>/dev/null; then
            pip install pytest || true
            pytest -q || true
          else
            echo "No tests found, skipping."
          fi

      - name: Optional lint (flake8)
        run: |
          if grep -q "flake8" requirements.txt 2>/dev/null; then
            pip install flake8 || true
            flake8 || true
          else
            echo "flake8 not configured."
          fi
