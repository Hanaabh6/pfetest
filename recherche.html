<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recherche d'Objets - SmartLocate</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header h1 {
            font-size: 28px;
            font-weight: bold;
        }
        
        .header .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .logout-btn {
            background: rgba(255,255,255,0.2);
            border: 1px solid white;
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .logout-btn:hover {
            background: rgba(255,255,255,0.3);
        }
        
        .search-section {
            padding: 30px;
            background: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
        }
        
        .search-container {
            display: flex;
            gap: 10px;
        }
        
        #mainSearch {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e9ecef;
            border-radius: 6px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        #mainSearch:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .table-section {
            padding: 30px;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        thead {
            background: #f8f9fa;
            border-bottom: 2px solid #e9ecef;
        }
        
        th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            color: #495057;
            font-size: 14px;
        }
        
        td {
            padding: 15px;
            border-bottom: 1px solid #e9ecef;
        }
        
        tr:hover {
            background: #f8f9fa;
        }
        
        .badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .badge-active {
            background: #d4edda;
            color: #155724;
        }
        
        .badge-inactive {
            background: #f8d7da;
            color: #721c24;
        }
        
        .btn-take {
            background: #28a745;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: background 0.3s;
        }
        
        .btn-take:hover {
            background: #218838;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 400px;
            width: 90%;
        }
        
        .modal-header {
            font-size: 20px;
            font-weight: 700;
            color: #212529;
            margin-bottom: 15px;
        }
        
        .modal-body {
            color: #495057;
            margin-bottom: 20px;
            line-height: 1.6;
        }
        
        .modal-footer {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .btn-cancel {
            background: #e9ecef;
            color: #495057;
        }
        
        .btn-cancel:hover {
            background: #dee2e6;
        }
        
        .btn-confirm {
            background: #28a745;
            color: white;
        }
        
        .btn-confirm:hover {
            background: #218838;
        }
        
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #6c757d;
        }
    </style>
  <link rel="stylesheet" href="theme.css">
  <script data-theme-role-script>
    (function () {
      var path = (window.location.pathname.split('/').pop() || '').toLowerCase();
      var page = path.replace('.html', '') || 'home';
      document.documentElement.setAttribute('data-page', page);

      var role = (localStorage.getItem('userRole') || '').toLowerCase();
      if (!role) {
        if (page.indexOf('admin') >= 0 || ['index','ajouter-objet','objets','localisations','parametres'].indexOf(page) >= 0) {
          role = 'admin';
        } else if (page.indexOf('user') >= 0 || ['user','mesobjet','localisations-user','parametres-user'].indexOf(page) >= 0) {
          role = 'user';
        } else {
          role = 'guest';
        }
      }
      document.documentElement.setAttribute('data-role', role);
    })();
  </script></head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div>
                <h1><i class="fas fa-search"></i> Recherche d'Objets</h1>
            </div>
            <div class="user-info">
                <span id="username">Utilisateur</span>
                <button class="logout-btn" onclick="logout()">
                    <i class="fas fa-sign-out-alt"></i> Déconnexion
                </button>
            </div>
        </div>
        
        <!-- Search Section -->
        <div class="search-section">
            <div class="search-container">
                <input 
                    type="text" 
                    id="mainSearch" 
                    placeholder="🔍 Rechercher un objet (ECLAIRAGE, bureau, etc...)"
                >
            </div>
        </div>
        
        <!-- Results Table -->
        <div class="table-section">
            <table>
                <thead>
                    <tr>
                        <th>Nom de l'Objet</th>
                        <th>Type</th>
                        <th>Localisation</th>
                        <th>Statut</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr>
                        <td colspan="5" class="empty-state">
                            <i class="fas fa-search" style="font-size: 40px; margin-bottom: 10px;"></i>
                            <p>Commence à taper pour chercher un objet</p>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    
    <!-- Modal: Prendre un Objet -->
    <div id="takeObjectModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <i class="fas fa-exclamation-circle" style="color: #ffc107;"></i> Confirmer la prise d'objet
            </div>
            <div class="modal-body">
                <p>Êtes-vous sûr de vouloir prendre cet objet ?</p>
                <hr style="border: none; border-top: 1px solid #e9ecef; margin: 15px 0;">
                <div style="background: #f8f9fa; padding: 12px; border-radius: 6px;">
                    <strong id="modalObjectName">-</strong><br>
                    <small style="color: #6c757d;">
                        📍 <span id="modalObjectLocation">-</span>
                    </small>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-cancel" onclick="closeTakeModal()">Non, annuler</button>
                <button class="btn btn-confirm" onclick="confirmTakeObject()">Oui, prendre</button>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script>
        const API_BASE = (window.APP_CONFIG && window.APP_CONFIG.API_BASE) || 'http://127.0.0.1:8000';
        let selectedObject = null;

        // Charger les objets au démarrage
        window.onload = () => {
            const username = localStorage.getItem('username') || 'Utilisateur';
            document.getElementById('username').textContent = username;
            chargerObjets("");
        };

        // Recherche en temps réel
        document.getElementById('mainSearch').addEventListener('input', (e) => {
            chargerObjets(e.target.value);
        });

        async function chargerObjets(query = "") {
            try {
                const response = await fetch(`${API_BASE}/things/search`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        search_query: query
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const items = await response.json();
                const tbody = document.getElementById('tableBody');

                if (items.length === 0) {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="5" class="empty-state">
                                <p>Aucun objet trouvé</p>
                            </td>
                        </tr>
                    `;
                    return;
                }

                tbody.innerHTML = items.map(item => `
                    <tr>
                        <td>
                            <i class="fas fa-cube" style="color: #667eea; margin-right: 8px;"></i>
                            <strong>${item.name || 'Sans nom'}</strong>
                        </td>
                        <td>${item.type || '-'}</td>
                        <td>${item.location?.room || item.location || '-'}</td>
                        <td>
                            <span class="badge ${item.status === 'active' || item.status === 'disponible' ? 'badge-active' : 'badge-inactive'}">
                                ${item.status || 'Inconnu'}
                            </span>
                        </td>
                        <td>
                            ${item.status === 'active' || item.status === 'disponible' ? `
                                <button class="btn-take" onclick="openTakeModal('${item.id}', '${(item.name || 'Objet').replace(/'/g, "\\'")}', '${(item.location?.room || item.location || 'N/A').replace(/'/g, "\\'")}')" >
                                    <i class="fas fa-hand-up"></i> Prendre
                                </button>
                            ` : '<span style="color: #6c757d;">-</span>'}
                        </td>
                    </tr>
                `).join('');
            } catch (error) {
                console.error("Erreur chargement:", error);
                document.getElementById('tableBody').innerHTML = `
                    <tr>
                        <td colspan="5" class="empty-state" style="color: #dc3545;">
                            <i class="fas fa-exclamation-triangle"></i> Erreur de connexion au serveur
                        </td>
                    </tr>
                `;
            }
        }

        function openTakeModal(objectId, objectName, objectLocation) {
            selectedObject = { id: objectId, name: objectName };
            document.getElementById('modalObjectName').textContent = objectName;
            document.getElementById('modalObjectLocation').textContent = objectLocation;
            document.getElementById('takeObjectModal').style.display = 'flex';
        }

        function closeTakeModal() {
            document.getElementById('takeObjectModal').style.display = 'none';
            selectedObject = null;
        }

        async function confirmTakeObject() {
            if (!selectedObject || !selectedObject.id) {
                alert('Erreur: Objet non sélectionné');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/things/${encodeURIComponent(selectedObject.id)}/status`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: 'inactive' })
                });

                const result = await response.json();

                if (!response.ok) {
                    alert('Erreur: ' + (result.detail || 'Impossible de mettre à jour'));
                    return;
                }

                alert(`✓ Succès!\nL'objet "${selectedObject.name}" est maintenant indisponible.`);
                closeTakeModal();
                chargerObjets(document.getElementById('mainSearch').value || '');
            } catch (error) {
                console.error('Erreur:', error);
                alert('Erreur de connexion au serveur');
            }
        }

        function logout() {
            localStorage.clear();
            window.location.href = "login.html";
        }

        // Fermer le modal si on clique en dehors
        document.getElementById('takeObjectModal').addEventListener('click', (e) => {
            if (e.target.id === 'takeObjectModal') {
                closeTakeModal();
            }
        });
    </script>
</body>
</html>
